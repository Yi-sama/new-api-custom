# Include only inside the existing api.yisama.asia TLS server after backup.
location /tavern-app/ {
    proxy_pass http://127.0.0.1:32831/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
}

location /tavern-app/assets/ {
    proxy_pass http://127.0.0.1:32831/assets/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    proxy_buffering on;
    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/css application/wasm application/json;
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=63072000" always;
}

location ~ "^/tavern-app/assets/(?<tavern_asset>[^/]+-[A-Za-z0-9_-]{8}\.(?:js|css|woff2?))$" {
    proxy_pass http://127.0.0.1:32831/assets/$tavern_asset;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    proxy_buffering on;
    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/css;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=63072000" always;
}

location ~ ^/api/(?:new-api/|user/auth/new-api(?:/logout)?$|(?:read|write|list|remove|test_auth)$) {
    proxy_pass http://127.0.0.1:32831;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
}
